name: Update README

on:
  push:
    paths:
      - '.github/workflows/ci-docs-test.yml'
    branches:
      - master

permissions:
  contents: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git config --global 'credential.https://${{ secrets.GITEA_HOST }}.helper' "store --file=${RUNNER_TEMP}/gitea-credentials"
          [[ "$GITEA_TOKEN" == *:* ]] || GITEA_TOKEN+=":"
          printf 'url=https://%s@%s\n\n' "$GITEA_TOKEN" '${{ secrets.GITEA_HOST }}' | git credential approve
          git clone https://${{ secrets.GITEA_HOST }}/${{ github.repository }} -b ${{ github.ref_name }} --single-branch --depth=1

      - name: Install yq
        env:
          YQ_VERSION: v4.54.3
          YQ_SHA256: 129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973
        run: |
          curl -fsSL --retry 3 "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o "${RUNNER_TEMP}/yq"
          echo "${YQ_SHA256}  ${RUNNER_TEMP}/yq" | sha256sum -c -
          sudo install -m 755 "${RUNNER_TEMP}/yq" /usr/local/bin/yq

      - name: Update OS list in README
        working-directory: ${{ github.event.repository.name }}
        run: |
          {
            echo '<!-- OS-SUPPORT-LIST-START -->'
            yq -o=json '.jobs.prepare.steps[] | select(.id == "set-matrix").env' .github/workflows/ci-docs-test.yml \
              | jq -er '(.OS_MAP | fromjson) as $map | (.OS_ORDER | split(" "))[] | select(. != "rhel7" and . != "centos7") | "- " + $map[.][0]'
            echo '<!-- OS-SUPPORT-LIST-END -->'
          } > os_block.tmp

          awk '
            BEGIN { in_block=0 }
            /<!-- OS-SUPPORT-LIST-START -->/ { print_file="yes"; while ((getline line < "os_block.tmp") > 0) print line; in_block=1; next }
            /<!-- OS-SUPPORT-LIST-END -->/ { in_block=0; next }
            !in_block { print }
          ' README.md > README.new && mv README.new README.md
          rm os_block.tmp

      - name: Commit changes (if any)
        working-directory: ${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add README.md
            git commit -m "Update OS list in README"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit"
          fi

