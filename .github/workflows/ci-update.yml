name: Update OCI Docs

on:
  workflow_dispatch:
    inputs:
      distros:
        type: string
        description: Select distros (comma-separated)
        default: |
          centos8s,
          centos9s,
          centos10,
          debian11,
          debian12,
          debian13,
          ubuntu2004,
          ubuntu2204,
          ubuntu2404,
          ubuntu2604
      deb_build:
        type: boolean
        description: "Override: All DEB-based distros"
        default: false
      rpm_build:
        type: boolean
        description: "Override: All RPM-based distros"
        default: false

  schedule:
    - cron: '0 21 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.get-version.outputs.version }}
    steps:

      - name: Set matrix names
        id: set-matrix
        env:
          OS_ORDER: centos8s centos9s centos10 debian11 debian12 debian13 ubuntu2004 ubuntu2204 ubuntu2404 ubuntu2604
          OS_MAP: |
            {
              "centos8s":   ["CentOS 8 Stream", "onlyoffice", "docs-centos8s"],
              "centos9s":   ["CentOS 9 Stream", "onlyoffice", "docs-centos9s"],
              "centos10":   ["CentOS 10 Stream","onlyoffice", "docs-centos10"],
              "debian11":   ["Debian 11",       "onlyoffice", "docs-debian11"],
              "debian12":   ["Debian 12",       "onlyoffice", "docs-debian12"],
              "debian13":   ["Debian 13",       "onlyoffice", "docs-debian13"],
              "ubuntu2004": ["Ubuntu 20.04",    "onlyoffice", "docs-ubuntu2004"],
              "ubuntu2204": ["Ubuntu 22.04",    "onlyoffice", "docs-ubuntu2204"],
              "ubuntu2404": ["Ubuntu 24.04",    "onlyoffice", "docs-ubuntu2404"],
              "ubuntu2604": ["Ubuntu 26.04",    "onlyoffice", "docs-ubuntu2604"]
            }
        run: |
          declare -A os_set

          # Handle individual distro selection (only when no override flags set)
          if [[ "${{ github.event.inputs.deb_build }}" != "true" && "${{ github.event.inputs.rpm_build }}" != "true" ]]; then
            DISTROS_INPUT="${{ github.event.inputs.distros }}"
            [[ -z "$DISTROS_INPUT" ]] && DISTROS_INPUT="$OS_ORDER"
            for os in ${DISTROS_INPUT//,/ }; do
              os_trimmed="$(echo "$os" | xargs)"
              [[ -n "$os_trimmed" ]] && os_set["$os_trimmed"]=1
            done
          fi

          # Override: All DEB-based distros (Debian/Ubuntu)
          [[ "${{ github.event.inputs.deb_build }}" == "true" ]] && \
            for os in $(jq -r 'to_entries[] | select(.value[0] | test("Debian|Ubuntu")) | .key' <<< "$OS_MAP"); do os_set["$os"]=1; done

          # Override: All RPM-based distros (CentOS)
          [[ "${{ github.event.inputs.rpm_build }}" == "true" ]] && \
            for os in $(jq -r 'to_entries[] | select(.value[0] | test("CentOS")) | .key' <<< "$OS_MAP"); do os_set["$os"]=1; done

          # Build matrix in defined order
          matrix=$(jq -c -n --argjson map "$OS_MAP" --arg order "$OS_ORDER" \
            --argjson list "$(printf '%s\n' "${!os_set[@]}" | jq -R . | jq -s .)" \
            '{include: [($order | split(" "))[] | select(. as $k | $list[] == $k) | {name: $map[.][0], os: ($map[.][2] // .), distr: $map[.][1]}]}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Get latest release version
        id: get-version
        run: |
          VERSION=$(git ls-remote --heads "https://${{ secrets.GITEA_TOKEN }}@${{ secrets.GITEA_HOST }}/ONLYOFFICE/document-server-package" \
            'refs/heads/release/v*' 'refs/heads/hotfix/v*' | awk -F/ '{print $NF}' | sed 's/^v//' | sort -Vr | head -n1)
          echo "version=${VERSION:-99.99.99}" >> "$GITHUB_OUTPUT"

  update-test:
    name: "Update (${{ matrix.name }})"
    runs-on: ubuntu-22.04
    needs: [prepare]
    defaults:
      run:
        working-directory: tests/vagrant
    env:
      VER: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{fromJSON(needs.prepare.outputs.matrix)}}

    steps:
      - name: Free Disk Space
        working-directory: ${{ github.workspace }}
        run: |
          sudo docker image prune --all --force
          sudo rm -rf /usr/local/lib/android || true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get update and install vagrant
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          sudo echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update -y
          sudo apt-get install -y vagrant aria2
          # Temporary install VBox 7.1.12 via curl (.deb) to avoid SSH/NAT issues in 7.1.14
          VBOX_DEB=$(curl -fsSL https://download.virtualbox.org/virtualbox/7.1.12/MD5SUMS | grep -oE 'virtualbox-7\.1_7\.1\.12-[0-9]+~Ubuntu~jammy_amd64\.deb' | head -n1)
          [ -n "$VBOX_DEB" ] || { echo "ERROR: could not detect VBox .deb filename"; exit 1; }
          curl -fsSL "https://download.virtualbox.org/virtualbox/7.1.12/${VBOX_DEB}" -o /tmp/vbox.deb
          sudo apt-get install -y /tmp/vbox.deb

      - name: "Boot VM for ${{matrix.name}}"
        timeout-minutes: 45
        env:
          DISTR: ${{ matrix.distr }}
          OS: ${{ matrix.os }}
          RAM: '4096'
          CPU: '2'
        run: |
          set -eux

          # Prefetch the box with multi-connection aria2 — vagrant's own downloader is single-stream (falls back to it below if aria2 fails, e.g. a CDN rate-limit near completion on large boxes)
          box_name="${DISTR}/${OS}"
          box_url=$(curl -fsSL "https://vagrantcloud.com/api/v2/vagrant/${box_name}" \
            | jq -r '[.versions[0].providers[] | select(.name == "virtualbox" and (.architecture // "amd64") == "amd64")][0].url // empty' || true)
          if [ -n "$box_url" ]; then
            aria2_opts=(-x16 -s16 -k4M --max-tries=5 --retry-wait=3 --file-allocation=none --console-log-level=warn --summary-interval=30 -d /tmp -o vagrant.box)
            # a failure typically happens near completion — resume with -c instead of restarting from scratch
            (aria2c "${aria2_opts[@]}" "$box_url" || aria2c -c "${aria2_opts[@]}" "$box_url") \
              && vagrant box add --name "${box_name}" /tmp/vagrant.box \
              || echo "Box prefetch failed, vagrant will download it itself"
            rm -f /tmp/vagrant.box /tmp/vagrant.box.aria2
          fi

          # VM boot on shared runners is flaky — destroy and retry once on failure or hang
          timeout --kill-after=60s 20m vagrant up --no-provision --provider=virtualbox || {
            echo "VM boot failed or timed out after 20 minutes, retrying..."
            pkill -TERM -f '[v]agrant|[r]uby.*vagrant' || true
            sleep 5
            pkill -KILL -f '[v]agrant|[r]uby.*vagrant' || true
            vagrant destroy --force || true
            timeout --kill-after=60s 20m vagrant up --no-provision --provider=virtualbox
          }

      - name: Update
        timeout-minutes: 30
        env:
          DISTR: ${{ matrix.distr }}
          RAM: '4096'
          CPU: '2'
          OS: ${{ matrix.os }}
          IT: '-it enterprise'  # docs-* boxes are pre-built with the EE edition
        run: |
          set -eux
          export DOWNLOAD_SCRIPT='-ds false'
          export TEST_REPO='-tr true'
          export VER="-v ${VER}"
          export ARGUMENTS="-arg '--skiphardwarecheck true --makeswap false --localscripts true --update true'"
          vagrant provision

      - name: Health check
        timeout-minutes: 10
        run: |
          if vagrant status | grep -q "running"; then
            vagrant ssh -c "sudo bash /home/vagrant/tests/vagrant/post-install.sh healthcheck"
          else
            echo "VM is not running, skipping health check"
          fi

      - name: Smoke test
        timeout-minutes: 10
        run: EXPECTED_VERSION="${VER}" bash smoke-test.sh

      - name: "Uninstall on ${{matrix.name}}"
        timeout-minutes: 20
        run: |
          if vagrant status | grep -q "running"; then
            vagrant ssh -c "sudo bash /home/vagrant/tests/vagrant/post-install.sh uninstall --localscripts true"
          else
            echo "VM is not running, cannot run uninstall test"
            exit 1
          fi

      - name: Collect logs
        if: always()
        run: |
          if vagrant status | grep -q "running"; then
            vagrant ssh -c "sudo bash /home/vagrant/tests/vagrant/post-install.sh logs" || true
          else
            echo "VM is not running, skipping log collection"
          fi

      - name: Cleanup
        if: always()
        run: |
          vagrant destroy --force || true
          vagrant global-status --prune || true
