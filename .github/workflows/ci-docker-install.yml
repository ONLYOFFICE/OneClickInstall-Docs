name: Install OCI Docker

on:
  schedule:
    - cron: '00 21 * * 0'
  push:
    branches:
      - 'hotfix/**'
      - 'release/**'
      - 'develop'
      - 'master'
    paths:
      - '.github/workflows/ci-docker-install.yml'
      - 'install.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  Install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Free Disk Space
        run: |
          sudo docker image prune --all --force

      - name: Decode and Docker login
        id: decode
        run: |
          set +x
          IFS=':' read -r USERNAME PASSWORD <<< "$(echo "${{ secrets.DOCKER_AUTH_KEY }}" | base64 -d)"
          echo "::add-mask::$USERNAME" && echo "::add-mask::$PASSWORD"
          { echo "username=$USERNAME"; echo "password=$PASSWORD"; } | tee -a $GITHUB_OUTPUT
          echo "$PASSWORD" | docker login --username "$USERNAME" --password-stdin

      - name: Test Docs Docker scripts
        run: |
          extra_args=""
          [ "${{ github.ref }}" = "refs/heads/master" ] || extra_args="-di onlyoffice/4testing-documentserver"
          sudo bash -x install.sh -un "${{ steps.decode.outputs.username }}" -p "${{ steps.decode.outputs.password }}" -skiphc true $extra_args </dev/null

      - name: Wait for container to become healthy
        run: |
          container=$(docker ps --all --format "{{.Names}}" | head -n1)
          echo "container=$container" >> "$GITHUB_ENV"

          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Status}}' "$container")
            [ "$status" = "running" ] || { echo -e "\033[0;31m$container is NOT running. Status: $status.\033[0m"; exit 1; }

            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")
            case "$health" in
              starting) sleep 5 ;;
              healthy|none) echo -e "\033[0;32m$container is $health.\033[0m"; exit 0 ;;
              *) echo -e "\033[0;31m$container is $health.\033[0m"; exit 1 ;;
            esac
          done

          echo -e "\033[0;31mTimed out waiting for $container to become healthy.\033[0m"
          echo "container_status=timeout" >> "$GITHUB_ENV"
          exit 1

      - name: Print logs for crashed container
        if: failure()
        run: |
          docker logs "${{ env.container }}" | sed "s/^/\t/"
          if [ "${{ env.container_status }}" = "timeout" ]; then
            echo "Timeout. Container failed"
            exit 1
          fi

