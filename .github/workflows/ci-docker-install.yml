name: Install OCI Docker

on:
  schedule:
    - cron: '00 21 * * 0'
  push:
    branches:
      - 'hotfix/**'
      - 'release/**'
      - 'develop'
      - 'master'
    paths:
      - '.github/workflows/ci-docker-install.yml'
      - 'install.sh'
      - 'tests/smoke/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  Install:
    name: "Install (${{ matrix.edition }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [community, enterprise]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Free Disk Space
        run: |
          sudo docker image prune --all --force

      - name: Decode and Docker login
        id: decode
        run: |
          set +x
          IFS=':' read -r USERNAME PASSWORD <<< "$(echo "${{ secrets.DOCKER_AUTH_KEY }}" | base64 -d)"
          echo "::add-mask::$USERNAME" && echo "::add-mask::$PASSWORD"
          { echo "username=$USERNAME"; echo "password=$PASSWORD"; } | tee -a $GITHUB_OUTPUT
          echo "$PASSWORD" | docker login --username "$USERNAME" --password-stdin

      - name: Test Docs Docker scripts
        run: |
          case "${{ matrix.edition }}" in
            community)  image="documentserver" ;;
            enterprise) image="documentserver-ee" ;;
            developer)  image="documentserver-de" ;;
          esac
          [ "${{ github.ref }}" = "refs/heads/master" ] || image="4testing-${image}"
          extra_args="-it ${{ matrix.edition }} -di onlyoffice/${image}"
          sudo bash -x install.sh -un "${{ steps.decode.outputs.username }}" -p "${{ steps.decode.outputs.password }}" -skiphc true $extra_args </dev/null

      - name: Wait for container to become healthy
        run: |
          container=$(docker ps --all --format "{{.Names}}" | head -n1)
          echo "container=$container" >> "$GITHUB_ENV"

          timeout 5m bash -c 'while :; do
            state=$(docker inspect -f "{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "$1")
            case "$state" in running/starting) sleep 5 ;; running/healthy|running/none) echo "$1 is $state"; exit 0 ;; *) echo "$1 is $state"; exit 1 ;; esac
          done' -- "$container" \
            || { echo "::error::$container failed to become healthy"; exit 1; }

          # log tailing is the entrypoint's last step — its start means fonts/static/plugins are done
          timeout 5m bash -c 'until docker exec "$1" pgrep -f "tail -F" >/dev/null; do sleep 5; done' -- "$container" \
            || { echo "::error::Timed out waiting for container initialization"; exit 1; }

          docker exec "$container" supervisorctl start ds:example \
            || { docker exec "$container" sh -lc 'supervisorctl status ds:example; tail -100 /var/log/onlyoffice/documentserver-example/out.log'; echo "::error::ds:example failed to start"; exit 1; }

      - name: Print logs for crashed container
        if: failure()
        run: docker logs "$container" | sed "s/^/\t/"

      - name: Smoke test
        timeout-minutes: 15
        run: |
          PIP_BREAK_SYSTEM_PACKAGES=1 pip install -q --disable-pip-version-check -r tests/smoke/requirements.txt && python3 -m pytest tests/smoke/test_docs_smoke.py -v -s
