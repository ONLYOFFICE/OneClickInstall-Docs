name: Upload on S3

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/README.md'
      - '**/LICENSE'
      - '.github/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build:
    name: Chart release
    # Only master publishes the public installers; the environment lets the admins require an approval and hold the AWS secrets
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Creating additional scripts
        run: |
          for EDITION in ENTERPRISE DEVELOPER; do
            cp -rf "./docs-install.sh" "./docs-${EDITION,,}-install.sh"
            sed -i "/^PARAMETERS\|^PARAMS=(/s|\(-it\) [^\" ]\+|\1 ${EDITION}|g" "./docs-${EDITION,,}-install.sh"
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-east-1

      - name: Upload scripts
        run: |
          aws s3 cp . ${{ secrets.AWS_BUCKET_URL }}/docs --acl public-read --recursive --exclude "*" --include "*.sh" --exclude "tests/*" --exclude ".github/*"

      - name: Invalidate CLOUDFRONT cache
        run: |
          API_STATUS=$(aws apigateway test-invoke-method --rest-api-id ${{ secrets.AWS_REST_API_ID }} --resource-id "${{ secrets.AWS_RESOURCE_ID }}" \
            --http-method PUT --path-with-query-string "/prod/download-oo-com" --body "$(jq -c -n '.paths = $ARGS.positional' --args "/docs/*")" \
            --region us-east-1 --query 'status' --output text || :)
          echo "API Gateway test-invoke status: ${API_STATUS:-<failed>}"
